<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
 <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-indigo-600">DevStore</a>
      <nav class="flex items-center space-x-6">
        <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-medium">Products</a>
        <a href="cart.html" class="relative text-gray-600 hover:text-indigo-600 font-medium">
          Cart
          <span id="cart-badge" class="ml-1 px-2 py-0.5 text-xs bg-indigo-600 text-white rounded-full">0</span>
        </a>
        <div id="nav-auth"></div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-10 w-full">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-8">Featured Products</h2>
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-gray-400 text-center py-6">
    <p class="text-sm">&copy; Created by Me. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchAndDisplayProducts();
      updateCartBadge();
      checkAuthState();
    });
  </script>
</body>
</html>
