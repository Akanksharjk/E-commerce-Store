<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - DevStore</title>
  >
</head>

<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-indigo-600">DevStore</a>
      <a href="index.html" class="text-indigo-600 hover:underline font-medium">← Back to Shop</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10 w-full">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Your Shopping Cart</h2>
    <div id="cart-items-container" class="bg-white rounded-lg shadow p-6 mb-6"></div>

    <div class="bg-white rounded-lg shadow p-6 flex justify-between items-center">
      <div>
        <span class="text-gray-500 font-medium">Total Amount:</span>
        <span id="cart-total-price" class="text-2xl font-bold text-gray-900 ml-2">$0.00</span>
      </div>
      <button onclick="processOrder()"
        class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Process Order
      </button>
    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 text-center py-6">
    <p class="text-sm">&copy; Created by Me. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', renderCartPage);
  </script>
</body>

</html>
